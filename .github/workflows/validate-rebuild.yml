name: Validate LFAMILIA rebuild

on:
  push:
    branches:
      - 'rebuild/**'
    paths:
      - 'rebuild/**'
      - '.github/workflows/validate-rebuild.yml'
  pull_request:
    paths:
      - 'rebuild/**'
      - '.github/workflows/validate-rebuild.yml'

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}
          MYSQL_DATABASE: lfamilia_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ github.run_id }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_NAME: LFAMILIA STORE
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lfamilia_ci
      DB_USERNAME: root
      DB_PASSWORD: ${{ github.run_id }}
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, gd, exif
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PHP dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
      - name: Security guardrails
        run: |
          composer audit --no-interaction
          if git -C .. ls-files | grep -E '(^|/)[.]env$'; then
            echo "Tracked .env file detected."
            exit 1
          fi
          if git -C .. grep -n -E 'BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY' -- . ':!rebuild/tests/**'; then
            echo "Private key material detected in tracked source."
            exit 1
          fi
          if git -C .. grep -n -E "(api_key|server_key|client_secret|secret_key|access_token|bot_token)[[:space:]]*=>[[:space:]]*['\"][^$]" -- 'rebuild/app/**' 'rebuild/config/**' 'rebuild/routes/**' 'rebuild/resources/**'; then
            echo "Possible hardcoded secret detected."
            exit 1
          fi
      - name: Install frontend dependencies
        run: npm ci
      - name: Configure test app
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Check PHP syntax
        run: find app bootstrap config public routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate cached configuration
        run: |
          php artisan config:cache
          php artisan config:clear
      - name: Validate schema and assets
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --step=10 --force
          php artisan migrate --force
          npm run build
      - name: Run rebuild tests
        run: vendor/bin/phpunit
      - name: Check PHP style
        run: vendor/bin/pint --test
