name: Validate LFAMILIA Laravel

on:
  push:
    branches:
      - main
      - 'rebuild/**'
    paths:
      - 'rebuild/**'
      - '.github/workflows/validate-rebuild.yml'
  pull_request:
    paths:
      - 'rebuild/**'
      - '.github/workflows/validate-rebuild.yml'

permissions:
  contents: read

# Job dipecah supaya berjalan paralel: pemeriksaan statis tidak perlu menunggu
# container MySQL/Redis, dan smoke browser dibagi per kelompok viewport.
# Tidak ada pemeriksaan yang dihapus — hanya dipindah ke job yang tepat.
jobs:
  # Cepat, tanpa service container: kode, dependensi, gaya, aset deploy.
  foundation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rebuild
    env:
      APP_NAME: LFAMILIA STORE
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enforce Laravel-only repository shape
        run: |
          legacy_paths=(
            ../app ../components ../db ../drizzle ../hooks ../laravel ../lib
            ../public ../scripts ../tests ../vendor ../worker
            ../package.json ../package-lock.json ../next.config.ts ../vite.config.ts
            ../wrangler.jsonc ../drizzle.config.ts ../cloudflare-env.d.ts
          )
          for path in "${legacy_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "Legacy non-Laravel runtime path detected: $path"
              exit 1
            fi
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, gd, exif, pcntl
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist

      - name: Security guardrails
        run: |
          composer audit --no-interaction
          if git -C .. ls-files | grep -E '(^|/)[.]env$'; then
            echo "Tracked .env file detected."
            exit 1
          fi
          if git -C .. grep -n -E 'BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY' -- . ':!rebuild/tests/**'; then
            echo "Private key material detected in tracked source."
            exit 1
          fi
          if git -C .. grep -n -E "(api_key|server_key|client_secret|secret_key|access_token|bot_token)[[:space:]]*=>[[:space:]]*['\"][^$]" -- 'rebuild/app/**' 'rebuild/config/**' 'rebuild/routes/**' 'rebuild/resources/**'; then
            echo "Possible hardcoded secret detected."
            exit 1
          fi

      - name: Install frontend dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Validate local Git hooks
        env:
          LFAMILIA_ENABLE_HOOKS: '1'
        run: |
          npm run prepare
          npm run test:hooks

      - name: Configure test app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check PHP syntax
        run: find app bootstrap config public routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check PHP style
        run: vendor/bin/pint --test

      - name: Validate cached configuration
        run: |
          php artisan config:cache
          php artisan config:clear

      - name: Validate M12 deployment assets
        run: |
          find deploy -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          test -f deploy/systemd/lfamilia-queue.service.in
          # Queue worker must consume named order and email queues, not only the default queue.
          grep -Fq -- '--queue=fulfillment,notifications,default' deploy/systemd/lfamilia-queue.service.in
          test -f deploy/systemd/lfamilia-scheduler.service.in
          test -f deploy/systemd/lfamilia-backup.timer.in
          test -f deploy/systemd/lfamilia-restore-verify.timer.in
          grep -Fq 'BACKUP_REQUIRE_REMOTE=true' deploy/ops.env.example
          grep -Fq 'SESSION_SECURE_COOKIE=true' deploy/production.env.example
          grep -Fq 'TRUSTED_PROXIES=*' deploy/production.env.example
          grep -Fq 'artisan route:clear' deploy/deploy.sh
          grep -Fq 'artisan route:clear' deploy/rollback-source.sh

  # Butuh MySQL + Redis: migrasi, rollback, PHPUnit, backup/restore.
  php-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rebuild
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}
          MYSQL_DATABASE: lfamilia_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ github.run_id }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_NAME: LFAMILIA STORE
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lfamilia_ci
      DB_USERNAME: root
      DB_PASSWORD: ${{ github.run_id }}
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, gd, exif, pcntl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Configure test app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate schema
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --step=10 --force
          php artisan migrate --force

      - name: Verify M12 encrypted backup and restore
        run: |
          if ! command -v mysqldump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mysql-client
          fi
          install -d -m 0700 /tmp/lfamilia-ci-etc /tmp/lfamilia-ci-backups
          cat > /tmp/lfamilia-ci-etc/mysql.cnf <<EOF
          [client]
          host=127.0.0.1
          port=3306
          user=root
          password=${DB_PASSWORD}
          EOF
          chmod 0600 /tmp/lfamilia-ci-etc/mysql.cnf
          printf '%s\n' 'm12-ci-backup-passphrase' > /tmp/lfamilia-ci-etc/backup.pass
          chmod 0600 /tmp/lfamilia-ci-etc/backup.pass
          cat > /tmp/lfamilia-ci-etc/ops.env <<EOF
          BACKUP_DATABASE_NAME=${DB_DATABASE}
          MYSQL_DEFAULTS_FILE=/tmp/lfamilia-ci-etc/mysql.cnf
          MYSQL_ADMIN_DEFAULTS_FILE=/tmp/lfamilia-ci-etc/mysql.cnf
          BACKUP_PASSPHRASE_FILE=/tmp/lfamilia-ci-etc/backup.pass
          BACKUP_DIR=/tmp/lfamilia-ci-backups
          BACKUP_RETENTION_DAYS=7
          BACKUP_REQUIRE_REMOTE=false
          BACKUP_RCLONE_REMOTE=disabled-placeholder
          EOF
          OPS_ENV_FILE=/tmp/lfamilia-ci-etc/ops.env bash deploy/backup.sh
          OPS_ENV_FILE=/tmp/lfamilia-ci-etc/ops.env bash deploy/restore-verify.sh

      - name: Run rebuild tests
        run: vendor/bin/phpunit

  # Dua job identik kecuali ADMIN_UI_SIZES, supaya smoke 8 viewport admin
  # tidak lagi menjadi satu blok tiga menit.
  browser-mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rebuild
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}
          MYSQL_DATABASE: lfamilia_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ github.run_id }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_NAME: LFAMILIA STORE
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lfamilia_ci
      DB_USERNAME: root
      DB_PASSWORD: ${{ github.run_id }}
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      ADMIN_UI_SIZES: '360x800,390x844,412x915,430x932'
      SMOKE_STAGES: 'admin'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, gd, exif, pcntl
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Configure test app
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Build frontend
        run: npm run build

      - name: Run M11 browser smoke
        run: bash tests/Browser/smoke.sh

  browser-desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rebuild
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}
          MYSQL_DATABASE: lfamilia_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ github.run_id }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_NAME: LFAMILIA STORE
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lfamilia_ci
      DB_USERNAME: root
      DB_PASSWORD: ${{ github.run_id }}
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      ADMIN_UI_SIZES: '1024x768,1280x800,1440x900,1920x1080'
      SMOKE_STAGES: 'responsive admin checkout'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, gd, exif, pcntl
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Configure test app
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Build frontend
        run: npm run build

      - name: Run M11 browser smoke
        run: bash tests/Browser/smoke.sh

      - name: Upload checkout visual comparison
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checkout-lab-comparison-desktop
          path: rebuild/checkout-visual-results
          if-no-files-found: warn

  frontend-static:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rebuild/package-lock.json

      - name: Install frontend dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Test ordering and customer/admin UI regressions
        run: node --test tests/Browser/customer-ui-guards.test.mjs tests/Browser/admin-ui-guards.test.mjs

      - name: Lint Vue and JavaScript
        run: npm run lint

      - name: Check Vue SFCs
        run: npm run check

      - name: Build frontend
        run: npm run build
