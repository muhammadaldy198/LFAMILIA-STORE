name: Validate LFAMILIA rebuild

on:
  push:
    branches:
      - 'rebuild/**'
    paths:
      - 'rebuild/**'
      - '.github/workflows/validate-rebuild.yml'
  pull_request:
    paths:
      - 'rebuild/**'
      - '.github/workflows/validate-rebuild.yml'

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}
          MYSQL_DATABASE: lfamilia_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ github.run_id }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_NAME: LFAMILIA STORE
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lfamilia_ci
      DB_USERNAME: root
      DB_PASSWORD: ${{ github.run_id }}
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PHP dependencies
        run: |
          composer update --no-interaction --prefer-dist
          composer validate --strict
      - name: Install frontend dependencies
        run: npm ci
      - name: Configure test app
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Check PHP syntax
        run: find app bootstrap public routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate schema and assets
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --step=3 --force
          php artisan migrate --force
          npm run build
      - name: Run foundation tests
        run: vendor/bin/phpunit
      - name: Check PHP style
        run: vendor/bin/pint --test
      - name: Upload resolved M3 Composer lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-composer-lock
          path: rebuild/composer.lock
          if-no-files-found: ignore
