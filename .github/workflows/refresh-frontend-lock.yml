name: Refresh frontend lockfile

on:
  push:
    branches:
      - rebuild/tahap-2-frontend-static-analysis
    paths:
      - 'rebuild/package.json'
      - '.github/workflows/refresh-frontend-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh package lock
        run: cd rebuild && npm install --package-lock-only --ignore-scripts
      - name: Commit package lock
        shell: bash
        run: |
          if git diff --quiet -- rebuild/package-lock.json; then
            echo 'package-lock.json already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rebuild/package-lock.json
          git commit -m 'chore(frontend): refresh package lock for supported ESLint'
          git push origin HEAD:${GITHUB_REF_NAME}
