name: Refresh frontend lockfile

on:
  push:
    branches:
      - rebuild/tahap-2-frontend-static-analysis
    paths:
      - 'rebuild/package.json'
      - '.github/workflows/refresh-frontend-lock.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh package lock
        run: cd rebuild && npm install --package-lock-only --ignore-scripts
      - name: Emit package lock
        shell: bash
        run: |
          echo 'LOCKFILE_BEGIN'
          base64 -w0 rebuild/package-lock.json
          echo
          echo 'LOCKFILE_END'
