name: Validasi LFAMILIA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm run install:ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm exec tsc -- --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Wait for Cloudflare production deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const token = process.env.GH_TOKEN;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 36; attempt += 1) {
            const response = await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`, {
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "x-github-api-version": "2022-11-28",
                "user-agent": "lfamilia-production-validation",
              },
              signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) throw new Error(`GitHub check-runs HTTP ${response.status}`);
            const payload = await response.json();
            const cloudflare = (payload.check_runs || []).find((item) =>
              typeof item.name === "string" && item.name.startsWith("Workers Builds:"),
            );
            if (cloudflare?.status === "completed") {
              if (cloudflare.conclusion !== "success") {
                throw new Error(`Cloudflare production build selesai dengan ${cloudflare.conclusion || "unknown"}.`);
              }
              console.log(`Cloudflare production deployment SUCCESS: ${cloudflare.name}`);
              process.exit(0);
            }
            console.log(`Menunggu Cloudflare production deployment (${attempt}/36)...`);
            await sleep(10_000);
          }
          throw new Error("Cloudflare production deployment belum selesai dalam batas waktu.");
          NODE

      - name: Production smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PRODUCTION_BASE_URL: https://lfamiliastore.my.id
        run: |
          node <<'NODE'
          const base = new URL(process.env.PRODUCTION_BASE_URL).origin;
          const sha = process.env.GITHUB_SHA || "smoke";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function read(path, asJson = false) {
            let lastError;
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const url = new URL(path, base);
                url.searchParams.set("smoke", sha.slice(0, 12));
                const response = await fetch(url, {
                  headers: {
                    accept: asJson ? "application/json" : "text/html,application/xhtml+xml",
                    "cache-control": "no-cache",
                    "user-agent": "lfamilia-production-smoke",
                  },
                  signal: AbortSignal.timeout(20_000),
                });
                if (!response.ok) throw new Error(`${url.pathname} HTTP ${response.status}`);
                return asJson ? await response.json() : await response.text();
              } catch (error) {
                lastError = error;
                if (attempt < 6) await sleep(5_000);
              }
            }
            throw lastError;
          }

          async function securityRequest(path, init = {}) {
            const url = new URL(path, base);
            url.searchParams.set("security-smoke", sha.slice(0, 12));
            return fetch(url, {
              ...init,
              redirect: "manual",
              headers: {
                "cache-control": "no-cache",
                "user-agent": "lfamilia-production-security-smoke",
                ...(init.headers || {}),
              },
              signal: AbortSignal.timeout(20_000),
            });
          }

          const html = await read("/", false);
          if (!/LFAMILIA STORE/i.test(html)) throw new Error("Homepage production tidak memuat metadata LFAMILIA STORE.");

          const forgot = await read("/forgot-password", false);
          if (!/Lupa password|reset password/i.test(forgot)) throw new Error("Halaman lupa password production tidak valid.");

          const robots = await read("/robots.txt", false);
          if (!/sitemap\.xml/i.test(robots) || !/\/api\//i.test(robots)) throw new Error("robots.txt production tidak sesuai.");

          const sitemap = await read("/sitemap.xml", false);
          if (!/lfamiliastore\.my\.id/i.test(sitemap)) throw new Error("sitemap.xml production tidak valid.");

          const products = await read("/api/products", true);
          const storefront = await read("/api/storefront", true);
          if (!products || typeof products !== "object") throw new Error("Response /api/products bukan JSON object valid.");
          if (!storefront || typeof storefront !== "object") throw new Error("Response /api/storefront bukan JSON object valid.");

          const forbiddenKeys = new Set(["providerCode", "providerSku", "provider_code", "provider_sku"]);
          function assertPublic(value, trail = "root") {
            if (Array.isArray(value)) {
              value.forEach((entry, index) => assertPublic(entry, `${trail}[${index}]`));
              return;
            }
            if (!value || typeof value !== "object") return;
            for (const [key, entry] of Object.entries(value)) {
              if (forbiddenKeys.has(key)) throw new Error(`Metadata provider bocor di ${trail}.${key}`);
              assertPublic(entry, `${trail}.${key}`);
            }
          }
          assertPublic(products);
          const securityHome = await securityRequest("/");
          if (!securityHome.ok) throw new Error(`Security header probe HTTP ${securityHome.status}`);
          const requiredHeaders = [
            ["x-content-type-options", "nosniff"],
            ["x-frame-options", "DENY"],
            ["strict-transport-security", "max-age="],
            ["content-security-policy", "frame-ancestors 'none'"],
            ["referrer-policy", "strict-origin-when-cross-origin"],
          ];
          for (const [name, expected] of requiredHeaders) {
            const value = securityHome.headers.get(name) || "";
            if (!value.toLowerCase().includes(expected.toLowerCase())) {
              throw new Error(`Security header ${name} tidak valid: ${value || "missing"}`);
            }
          }

          const crossSite = await securityRequest("/api/auth/login", {
            method: "POST",
            headers: {
              origin: "https://security-smoke.invalid",
              "sec-fetch-site": "cross-site",
              "content-type": "application/json",
            },
            body: "{}",
          });
          if (crossSite.status !== 403) {
            throw new Error(`Cross-site mutation tidak ditolak, HTTP ${crossSite.status}`);
          }

          const corsProbe = await securityRequest("/api/products", {
            method: "OPTIONS",
            headers: {
              origin: "https://security-smoke.invalid",
              "access-control-request-method": "GET",
            },
          });
          if (corsProbe.headers.get("access-control-allow-origin") === "*") {
            throw new Error("CORS wildcard terdeteksi di production.");
          }

          const adminProbe = await securityRequest("/api/admin/dashboard-integrations");
          if (![301, 302, 303, 307, 308, 401, 403].includes(adminProbe.status)) {
            throw new Error(`Admin API tidak tertutup untuk request anonim, HTTP ${adminProbe.status}`);
          }

          console.log("Production smoke SUCCESS: storefront, provider boundary, security headers, CSRF/CORS, dan admin boundary sehat.");
          NODE
