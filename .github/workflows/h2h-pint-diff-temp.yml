name: H2H temporary Pint diff
on:
  push:
    branches:
      - feat/h2h-nickname-region-20261106
permissions:
  contents: read
jobs:
  format-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Pint style diff for modified files
        run: |
          vendor/bin/pint app/Services/H2hNicknameClient.php app/Services/NicknameService.php app/Services/RegionCheckProof.php tests/Feature/CheckoutH2hValidationTest.php
          echo '--- START PINT DIFF ---'
          git diff -- app/Services/H2hNicknameClient.php app/Services/NicknameService.php app/Services/RegionCheckProof.php tests/Feature/CheckoutH2hValidationTest.php
          echo '--- END PINT DIFF ---'
