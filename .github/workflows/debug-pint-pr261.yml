name: Show Pint formatting for PR 261
on:
  push:
    branches:
      - 'fix/digiflazz-fixed-8pct-safe-cutoff'
permissions:
  contents: read
jobs:
  show-pint-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, pdo_mysql
      - name: Install Pint
        run: composer install --no-interaction --prefer-dist
      - name: Output formatting patch
        run: |
          vendor/bin/pint app/Http/Controllers/AdminCatalogController.php
          git diff -- app/Http/Controllers/AdminCatalogController.php
