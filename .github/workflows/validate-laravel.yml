name: Validate Laravel migration

on:
  push:
    branches:
      - migration/laravel-vps-production
  pull_request:
    paths:
      - 'laravel/**'
      - 'MIGRATION-LARAVEL.md'
      - '.github/workflows/validate-laravel.yml'

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run Laravel tests
        run: php artisan test
