name: Validate Laravel migration

on:
  push:
    branches:
      - migration/laravel-vps-production
  pull_request:
    paths:
      - 'laravel/**'
      - 'MIGRATION-LARAVEL.md'
      - '.github/workflows/validate-laravel.yml'

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none
      - name: Install Composer dependencies
        env:
          APP_URL: http://localhost
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run schema migrations on SQLite
        env:
          APP_URL: http://localhost
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/testing.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          touch database/testing.sqlite
          php artisan migrate --force
      - name: Run Laravel tests
        env:
          APP_URL: http://localhost
        run: php artisan test
