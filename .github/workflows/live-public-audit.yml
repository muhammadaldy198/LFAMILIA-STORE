name: Live Public Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Read-only production audit
        env:
          PRODUCTION_BASE_URL: https://lfamiliastore.my.id
        run: node scripts/live-public-audit.mjs
