name: Frontend Parity Preview

on:
  push:
    branches:
      - 'rebuild/frontend-parity'
    paths:
      - 'rebuild/**'
      - '.github/workflows/frontend-parity-preview.yml'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}
          MYSQL_DATABASE: lfamilia_preview
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ github.run_id }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_NAME: LFAMILIA STORE
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lfamilia_preview
      DB_USERNAME: root
      DB_PASSWORD: ${{ github.run_id }}
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: redis
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, redis, gd, exif
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
      - name: Configure preview app
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          npm run build
      - name: Seed visual preview data
        run: |
          mysql -h127.0.0.1 -uroot -p"${DB_PASSWORD}" "${DB_DATABASE}" <<'SQL'
          UPDATE providers SET is_active = 1 WHERE code = 'DIGIFLAZZ';
          INSERT INTO products (category_id, name, slug, margin_percent, sort_order, is_active, fulfillment_mode, description, created_at, updated_at)
          SELECT id, 'Mobile Legends', 'mobile-legends', 10.0000, 1, 1, 'AUTO_PROVIDER', 'Top up Mobile Legends cepat dan aman.', NOW(), NOW()
          FROM categories WHERE slug = 'game' LIMIT 1;
          SET @product_id = LAST_INSERT_ID();
          INSERT INTO product_input_fields (product_id, field_key, label, type, is_required, sort_order, created_at, updated_at)
          VALUES (@product_id, 'user_id', 'User ID', 'text', 1, 1, NOW(), NOW()),
                 (@product_id, 'server_id', 'Server ID', 'text', 1, 2, NOW(), NOW());
          INSERT INTO product_packages (product_id, code, name, nominal_value, sort_order, is_active, created_at, updated_at)
          VALUES (@product_id, 'ML5', '5 Diamonds', 5, 1, 1, NOW(), NOW()),
                 (@product_id, 'ML86', '86 Diamonds', 86, 2, 1, NOW(), NOW()),
                 (@product_id, 'ML172', '172 Diamonds', 172, 3, 1, NOW(), NOW());
          INSERT INTO provider_mappings (product_package_id, provider_id, external_sku, cost_idr, max_price_idr, priority, is_active, created_at, updated_at)
          SELECT pp.id, p.id, CONCAT('PREVIEW-', pp.code),
                 CASE pp.code WHEN 'ML5' THEN 1500 WHEN 'ML86' THEN 22000 ELSE 43000 END,
                 CASE pp.code WHEN 'ML5' THEN 2000 WHEN 'ML86' THEN 25000 ELSE 47000 END,
                 1, 1, NOW(), NOW()
          FROM product_packages pp CROSS JOIN providers p
          WHERE pp.product_id = @product_id AND p.code = 'DIGIFLAZZ';
          INSERT INTO admin_users (name, email, password, role, is_active, created_at, updated_at)
          VALUES ('Preview Owner', 'preview-admin@example.test', '$2y$12$abcdefghijklmnopqrstuvABCDEFGHijklmnopqrstuvABCD', 'SUPER_ADMIN', 1, NOW(), NOW());
          SQL
      - name: Add preview-only admin session route
        run: |
          cat >> routes/web.php <<'PHP'
          Route::get('/__preview/admin', function () {
              abort_unless(app()->environment('testing'), 404);
              auth('admin')->loginUsingId(1);
              return redirect('/admin/panel');
          });
          PHP
      - name: Start temporary preview server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/lfamilia-preview.log 2>&1 &
          echo $! > /tmp/lfamilia-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lfamilia-preview.log
          exit 1
      - name: Capture screenshots
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p preview-screenshots
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,1800 --screenshot=preview-screenshots/01-home-desktop.png http://127.0.0.1:8000/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,1200 --screenshot=preview-screenshots/02-home-mobile.png http://127.0.0.1:8000/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,2000 --screenshot=preview-screenshots/03-product-desktop.png http://127.0.0.1:8000/catalog/mobile-legends
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,1800 --screenshot=preview-screenshots/04-product-mobile.png http://127.0.0.1:8000/catalog/mobile-legends
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,1000 --screenshot=preview-screenshots/05-login-mobile.png http://127.0.0.1:8000/login
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,1000 --screenshot=preview-screenshots/06-admin-login-desktop.png http://127.0.0.1:8000/admin/login
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,1800 --screenshot=preview-screenshots/07-admin-dashboard-desktop.png http://127.0.0.1:8000/__preview/admin
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=390,1500 --screenshot=preview-screenshots/08-admin-dashboard-mobile.png http://127.0.0.1:8000/__preview/admin
          ls -lh preview-screenshots
      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lfamilia-frontend-parity
          path: rebuild/preview-screenshots/*.png
          retention-days: 1
