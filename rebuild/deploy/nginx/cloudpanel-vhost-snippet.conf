# LFAMILIA STORE CloudPanel vhost baseline.
# Replace __APP_PUBLIC__ with the absolute rebuild/public path.
# Keep CloudPanel's generated PHP-FPM upstream/location block.

root __APP_PUBLIC__;
index index.php;

client_max_body_size 8m;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /health/ready {
    try_files $uri /index.php?$query_string;
    access_log off;
}

location ~ /.(?!well-known).* {
    deny all;
}

location ~* .(?:env|log|sql|bak|ini)$ {
    deny all;
}

location ~* ^/(?:storage/logs|bootstrap/cache)/ {
    deny all;
}
