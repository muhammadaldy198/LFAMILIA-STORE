# LFAMILIA STORE CloudPanel vhost baseline.
# Replace __APP_PUBLIC__ with the absolute rebuild/public path.
# Keep CloudPanel's generated PHP-FPM upstream/location block.
# IMPORTANT: Laravel SecurityHeaders middleware is the single owner of
# HSTS, CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy and
# Permissions-Policy. CloudPanel's generated vhost and inherited configs
# MUST NOT declare add_header for those names. BETOL verifies/removes
# conflicting origin directives separately; deploy does not change VPS here.

root __APP_PUBLIC__;
index index.php;

client_max_body_size 8m;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Prevent a physical public/payment/ directory from shadowing Laravel's payment route.
# The internal rewrite retains the original request URI and query string.
# IMPORTANT: deploy.sh does not install this snippet into CloudPanel automatically.
# Reapply both exact-match locations to regenerated vhosts, then run nginx -t before reload.
location = /payment {
    rewrite ^ /index.php last;
}

location = /payment/ {
    rewrite ^ /index.php last;
}

location = /health/ready {
    try_files $uri /index.php?$query_string;
    access_log off;
}

location ~ /\.(?!well-known).* {
    deny all;
}

location ~* \.(?:env|log|sql|bak|ini)$ {
    deny all;
}

location ~* ^/(?:storage/logs|bootstrap/cache)/ {
    deny all;
}
